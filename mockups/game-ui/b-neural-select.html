<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steelmind Mockup B — Neural Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #ffb020;
    --ink: #e8e3d5;
    --dim: #97a1aa;
    --faint: #5d6870;
    --glass: rgba(12, 16, 20, .7);
    --accent: #e25837;
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Saira", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05070a; color: var(--ink); font-family: var(--body); user-select: none; }
  kbd { font-family: var(--mono); font-size: 11px; font-weight: 600; min-width: 26px; text-align: center; display: inline-block; padding: 2px 6px; border: 1px solid currentColor; border-bottom-width: 3px; border-radius: 4px; }

  /* ---------- world ---------- */
  .sky { position: fixed; inset: 0; background:
      radial-gradient(ellipse 60% 40% at 50% 58%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(ellipse 120% 60% at 50% 110%, #10161c, #05070a 70%);
    transition: background .8s; }
  .floor { position: fixed; left: -50%; right: -50%; top: 58%; height: 120%; transform-origin: top center; transform: perspective(500px) rotateX(72deg);
    background-image: linear-gradient(color-mix(in srgb, var(--accent) 45%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent) 1px, transparent 1px);
    background-size: 64px 64px; animation: floorRun 3s linear infinite;
    mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 60%, transparent); opacity: .5; }
  @keyframes floorRun { to { background-position: 0 64px; } }
  .backword { position: fixed; left: 0; right: 0; top: 13%; text-align: center; font-family: var(--display); font-weight: 800; font-size: 22vw; line-height: 1; letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 1px rgba(232,227,213,.06); white-space: nowrap; transform: perspective(800px) rotateX(18deg); pointer-events: none; }
  .fx { position: fixed; inset: 0; pointer-events: none; }
  .fx.scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); }
  .fx.vig { background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 50%, rgba(0,0,0,.8)); }

  /* ---------- top ---------- */
  .top { position: fixed; top: 26px; left: 36px; right: 36px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .brand { font-family: var(--display); font-weight: 800; letter-spacing: .24em; font-size: 20px; display: flex; gap: 12px; align-items: center; }
  .brand i { width: 26px; height: 26px; border: 3px solid var(--amber); transform: rotate(45deg); }
  .title { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; }
  .title small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .4em; color: var(--dim); }
  .title b { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .18em; }
  .steps { display: flex; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--faint); align-items: center; }
  .steps i { width: 36px; height: 4px; background: rgba(255,255,255,.1); transform: skewX(-30deg); }
  .steps i.on { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

  /* ---------- carousel ---------- */
  .stage { position: fixed; left: 50%; top: 50%; width: 0; height: 0; perspective: 1300px; perspective-origin: 50% 30%; }
  .tilt { transform-style: preserve-3d; transition: transform .25s ease-out; }
  .ring { transform-style: preserve-3d; transform: translateZ(-820px); }
  .card { position: absolute; left: -125px; top: -190px; width: 250px; height: 360px; transform-style: preserve-3d; cursor: pointer; transition: transform .9s cubic-bezier(.25,.9,.25,1), opacity .6s; backface-visibility: hidden; }
  .face { position: absolute; inset: 0; transform-style: preserve-3d; background:
      linear-gradient(160deg, rgba(255,255,255,.08), transparent 35%),
      linear-gradient(to bottom, rgba(18,23,28,.92), rgba(10,13,16,.96));
    clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
    padding: 18px 20px; display: flex; flex-direction: column; }
  .edge { position: absolute; inset: 0; pointer-events: none; clip-path: inherit; background: linear-gradient(var(--c), transparent 30%, transparent 70%, var(--c)); opacity: .35;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 1px; }
  .card.on .edge { opacity: 1; }
  .card .shade { position: absolute; inset: 0; background: #05070a; opacity: .5; transition: opacity .6s; clip-path: inherit; pointer-events: none; }
  .card.on .shade { opacity: 0; }
  .card .desig { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--c); display: flex; justify-content: space-between; }
  .card .name { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: .06em; text-transform: uppercase; line-height: 1; margin-top: auto; }
  .card .role { font-size: 13px; color: var(--dim); margin-top: 6px; }
  .card .slots { display: flex; gap: 4px; margin-top: 14px; }
  .card .slots i { flex: 1; height: 5px; background: var(--c); opacity: .7; transform: skewX(-30deg); }
  .card .slots i:last-child { background: #d64b3f; }

  /* the core: a 3D gyroscope */
  .core { position: relative; width: 150px; height: 150px; margin: 22px auto 0; transform-style: preserve-3d; }
  .core .orb { position: absolute; inset: 48px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff 0 6%, var(--c) 30%, color-mix(in srgb, var(--c) 30%, #000) 75%); box-shadow: 0 0 30px var(--c), 0 0 80px color-mix(in srgb, var(--c) 50%, transparent); animation: pulse 2.4s ease-in-out infinite; }
  .core .r { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--c); transform-style: preserve-3d; opacity: .85; }
  .core .r::before { content: ""; position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; background: var(--c); border-radius: 50%; box-shadow: 0 0 12px var(--c); }
  .core .r1 { animation: spinA 6s linear infinite; }
  .core .r2 { inset: 14px; border-style: dashed; animation: spinB 4.5s linear infinite; }
  .core .r3 { inset: 28px; border-width: 1px; animation: spinC 8s linear infinite; }
  .card:not(.on) .core * { animation-play-state: paused; }
  @keyframes spinA { from { transform: rotateX(70deg) rotateZ(0); } to { transform: rotateX(70deg) rotateZ(360deg); } }
  @keyframes spinB { from { transform: rotateY(65deg) rotateZ(0); } to { transform: rotateY(65deg) rotateZ(-360deg); } }
  @keyframes spinC { from { transform: rotateX(-40deg) rotateY(30deg) rotateZ(0); } to { transform: rotateX(-40deg) rotateY(30deg) rotateZ(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.08); filter: brightness(1.3); } }

  .pad { position: absolute; left: 50%; top: 210px; width: 900px; height: 240px; margin-left: -450px; border-radius: 50%; background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 35%, transparent), transparent 65%); transform: rotateX(90deg); filter: blur(4px); }

  /* ---------- side panels ---------- */
  .panel { position: fixed; top: 50%; width: 330px; padding: 20px 22px; background: var(--glass); backdrop-filter: blur(8px); z-index: 4; }
  .panel h3 { font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: .32em; color: var(--dim); margin-bottom: 14px; display: flex; justify-content: space-between; }
  .panel h3 b { color: var(--accent); font-weight: 600; }
  .left { left: 36px; transform: translateY(-50%) perspective(900px) rotateY(12deg); transform-origin: left center; border-left: 2px solid var(--accent); }
  .right { right: 36px; transform: translateY(-50%) perspective(900px) rotateY(-12deg); transform-origin: right center; border-right: 2px solid var(--accent); }

  .radar { width: 100%; height: auto; overflow: visible; }
  .radar .grid { fill: none; stroke: rgba(255,255,255,.1); }
  .radar .shape { fill: color-mix(in srgb, var(--accent) 30%, transparent); stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 6px var(--accent)); }
  .radar text { font-family: var(--mono); font-size: 9px; letter-spacing: .15em; fill: var(--dim); }
  .quote { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: .03em; margin-top: 10px; line-height: 1.15; }
  .flag { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 10px; letter-spacing: .1em; }

  /* isometric priority stack */
  .stack { position: relative; height: 210px; perspective: 900px; }
  .stack .iso { position: absolute; left: 20px; top: 70px; width: 130px; height: 130px; transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(-42deg); }
  .layer { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .35s cubic-bezier(.2,.8,.2,1), background .3s; background: rgba(40,50,58,.75); border: 1px solid rgba(255,255,255,.18); cursor: pointer; }
  .layer.em { background: rgba(214,75,63,.55); border-color: #d64b3f; }
  .layer.on { background: color-mix(in srgb, var(--accent) 65%, transparent); border-color: var(--accent); box-shadow: 0 0 24px var(--accent); }
  .labels { position: absolute; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0 22px; }
  .labels button { background: none; border: 0; color: var(--faint); font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-align: right; cursor: pointer; padding: 2px 0; }
  .labels button.on { color: var(--ink); }
  .labels button.on::before { content: "◀ "; color: var(--accent); }
  .labels button.em { color: #d64b3f; }
  .detail { min-height: 108px; margin-top: 6px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .detail .cond { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: .06em; margin-bottom: 6px; }
  .detail p { font-size: 14px; line-height: 1.5; }
  .kw { font-family: var(--mono); font-size: .86em; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 0 3px; }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- bottom ---------- */
  .bottom { position: fixed; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; gap: 34px; font-family: var(--display); font-weight: 600; letter-spacing: .16em; font-size: 15px; color: var(--dim); z-index: 5; }
  .bottom span { display: flex; align-items: center; gap: 8px; }
  .bottom kbd { color: var(--ink); }
  .bottom .go kbd { color: #111; background: var(--amber); border-color: var(--amber); }
  .bottom .go { color: var(--amber); }
  .dots { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 5; }
  .dots i { width: 10px; height: 10px; transform: rotate(45deg); border: 1px solid var(--faint); transition: all .3s; cursor: pointer; }
  .dots i.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* ---------- link sequence ---------- */
  .ring.linking .card.on { transform: var(--base) translateZ(160px) !important; }
  .link { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .link.on { opacity: 1; }
  .link .box { text-align: center; padding: 26px 60px; background: rgba(5,7,10,.75); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); backdrop-filter: blur(4px); }
  .link small { font-family: var(--mono); font-size: 11px; letter-spacing: .4em; color: var(--dim); }
  .link b { display: block; font-family: var(--display); font-weight: 800; font-size: 64px; letter-spacing: .14em; color: var(--accent); text-shadow: 0 0 30px var(--accent); line-height: 1.1; }
  .link .bar { width: 360px; height: 6px; margin: 12px auto 0; background: rgba(255,255,255,.1); }
  .link .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

  .mock { position: fixed; left: 36px; bottom: 30px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--faint); z-index: 6; }
  .mock a { color: var(--dim); text-decoration: none; margin-right: 10px; }
  .mock a:hover, .mock a.cur { color: var(--amber); }

  @media (max-width: 1100px) {
    .panel { display: none; }
    .bottom { gap: 14px; font-size: 12px; flex-wrap: wrap; }
    .title b { font-size: 22px; }
    .steps, .mock { display: none; }
    .top { left: 16px; right: 16px; }
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="floor"></div>
<div class="backword" id="backword">BERSERKER</div>

<header class="top">
  <div class="brand"><i></i>STEELMIND</div>
  <div class="title"><small>STEP 1 / 3 · NEURAL LOADER</small><b>SELECT BRAIN</b></div>
  <div class="steps">BRAIN <i class="on"></i><i></i><i></i></div>
</header>

<aside class="panel left">
  <h3>BEHAVIOUR MATRIX <b id="desig"></b></h3>
  <svg class="radar" viewBox="-130 -118 260 236" id="radar"></svg>
  <div class="quote" id="quote"></div>
  <div class="flag">MATRIX = FLAVOUR PREVIEW, NOT ENGINE DATA</div>
</aside>

<div class="stage"><div class="tilt" id="tilt"><div class="pad"></div><div class="ring" id="ring"></div></div></div>

<aside class="panel right">
  <h3>PRIORITY STACK <b>HOVER A LAYER</b></h3>
  <div class="stack">
    <div class="iso" id="iso"></div>
    <div class="labels" id="labels"></div>

  <span class="go"><kbd>ENTER</kbd> LINK BRAIN</span>
  <span><kbd>ESC</kbd> BACK</span>
</footer>

<div class="link" id="link"><div class="box"><small>NEURAL HANDSHAKE</small><b id="link-name">LINKED</b><div class="bar"><i id="link-bar"></i></div><small id="link-pct">SYNC 0%</small></div></div>
<div class="fx scan"></div>
<div class="fx vig"></div>
<div class="mock">MOCKUP · <a href="a-hangar-3d.html">A HANGAR</a><a class="cur" href="b-neural-select.html">B NEURAL</a><a href="c-cockpit-briefing.html">C COCKPIT</a></div>

<script>
// Data mirrors apps/web/src/features/brain-selection/brains.ts
const BRAINS = [
  { id: "BERSERKER", designation: "BRN-01", name: "Berserker", role: "Aggression as a system.", accent: "#e25837",
    core: "Close distance at any cost. Open with CHARGE, force ENGAGED combat, and win trades with MELEE_ATTACK. Never DEFEND while HP remains.",
    opening: "ROUND 1: CHARGE immediately. SCAN only if ENERGY is too low to move.",
    triggers: [["OWN ENERGY >= 20", "CHARGE the enemy and finish with MELEE_ATTACK."], ["DISTANCE_CATEGORY != CLOSE", "ADVANCE at full speed; keep ENERGY reserved for CHARGE."], ["ENEMY LAST ACTION = RETREAT", "PRESS the hunt: CHARGE to deny their escape."]],
    emergency: [25, "All-in: ignore DEFEND, spend every point of ENERGY on CHARGE and MELEE_ATTACK."],
    matrix: [95, 10, 15, 60, 90] },
  { id: "SENTINEL", designation: "BRN-02", name: "Sentinel", role: "The wall that answers back.", accent: "#5aa9b8",
    core: "Hold ground and outlast. Prefer DEFEND over DODGE, keep ENERGY above half, and punish every reckless CHARGE with MELEE_ATTACK.",
    opening: "ROUNDS 1-3: SCAN first, then DEFEND. No CHARGE until the enemy reveals its weapons.",
    triggers: [["OWN ENERGY < 25%", "DEFEND and avoid expensive actions while ENERGY regenerates."], ["ENEMY HP > 50%", "RANGED_ATTACK from LONG distance; never trade HP while they are strong."], ["ENEMY LAST ACTION = CHARGE", "Brace: DEFEND to stack armor reduction before impact."]],
    emergency: [30, "Survival mode: DEFEND every ROUND and RANGED_ATTACK only with spare ENERGY."],
    matrix: [30, 95, 50, 20, 20] },
  { id: "OPPORTUNIST", designation: "BRN-03", name: "Opportunist", role: "Punish every opening.", accent: "#ffb020",
    core: "Strike only when the enemy is weak. Watch ENEMY HP and ENERGY, hold MEDIUM range, and take every trade while INITIATIVE is yours.",
    opening: "ROUND 1: SCAN the enemy, then hold MEDIUM distance and wait for the opening.",
    triggers: [["ENEMY ENERGY < 25%", "ADVANCE and press with MELEE_ATTACK; they cannot pay for escapes."], ["ENEMY LAST ACTION = CHARGE", "DODGE the rush, then counter with MELEE_ATTACK."], ["INITIATIVE = OWN", "Take the trade now: MELEE_ATTACK before the enemy can answer."]],
    emergency: [35, "Break contact: RETREAT and RANGED_ATTACK from LONG until HP stabilizes."],
    matrix: [65, 40, 55, 65, 55] },
  { id: "TECHNICIAN", designation: "BRN-04", name: "Technician", role: "Information is ammunition.", accent: "#62b85a",
    core: "Win with information. SCAN until every enemy attribute is KNOWN, then spend ENERGY only on efficient, verified actions.",
    opening: "ROUNDS 1-3: SCAN every ROUND. No CHARGE and no MELEE_ATTACK until the enemy is mapped.",
    triggers: [["MELEE_WEAPON UNKNOWN", "SCAN before attacking; unknown weapons cost HP."], ["DISTANCE <= 10 m", "RETREAT out of CLOSE; trade only from range with RANGED_ATTACK."], ["OWN ENERGY = 100%", "Convert full ENERGY into RANGED_ATTACK pressure."]],
    emergency: [30, "Stall: DEFEND, RETREAT and DODGE while ENERGY regenerates. HP is recoverable, information is not."],
    matrix: [25, 50, 95, 45, 30] },
  { id: "TRICKSTER", designation: "BRN-05", name: "Trickster", role: "Pattern breaks win fights.", accent: "#c07ae0",
    core: "Be unreadable. Mix DODGE, DEFEND and sudden CHARGE bursts so the enemy never sees one pattern. Feint at MEDIUM, strike at CLOSE.",
    opening: "ROUND 1: SCAN, then alternate ADVANCE and RETREAT to distort their reads.",
    triggers: [["ENEMY LAST ACTION = DEFEND", "CHARGE now; their guard is set for a feint, not a rush."], ["DISTANCE_CATEGORY = MEDIUM", "Vary ADVANCE and RETREAT until the burst window opens."], ["ENEMY ENERGY < 50%", "They cannot afford pursuit: RANGED_ATTACK from LONG."]],
    emergency: [25, "Vanish: RETREAT hard, DODGE everything, and win on HP at the ROUND limit."],
    matrix: [55, 45, 40, 90, 70] },
];
const KEYWORDS = ["ADVANCE","RETREAT","CHARGE","MELEE_ATTACK","RANGED_ATTACK","DEFEND","DODGE","SCAN","HP","ENERGY","DISTANCE","INITIATIVE","ROUND","CLOSE","MEDIUM","LONG","MELEE_WEAPON","RANGED_WEAPON","ARMOR_CLASS","MOBILITY"];
const kwRe = new RegExp(`\\b(${KEYWORDS.join("|")})\\b`, "g");
const hl = (t) => t.replace(kwRe, '<span class="kw">$1</span>');

const $ = (id) => document.getElementById(id);
const N = BRAINS.length, STEP = 24, R = 820;
let layer = 0, linking = false;

/* ---------- build cards ---------- */
const ring = $("ring");
const cards = BRAINS.map((b, i) => {
  const c = document.createElement("div");
  c.className = "card"; c.style.setProperty("--c", b.accent);
  c.innerHTML = `<div class="face">
      <div class="desig"><span>${b.designation}</span><span>v1.0</span></div>
      <div class="core"><div class="r r1"></div><div class="r r2"></div><div class="r r3"></div><div class="orb"></div></div>
      <div class="name">${b.name}</div>
      <div class="role">${b.role}</div>
      <div class="slots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div><div class="edge"></div><div class="shade"></div>`;
  ring.appendChild(c);
  return c;
});
const dots = BRAINS.map(() => { const d = document.createElement("i"); $("dots").appendChild(d); return d; });

/* ---------- radar ---------- */
const AXES = ["AGGRESSION", "DEFENSE", "INTEL", "MOBILITY", "RISK"];
const pt = (i, v) => { const a = -Math.PI / 2 + (i / 5) * Math.PI * 2; return [Math.cos(a) * v, Math.sin(a) * v]; };
const radar = $("radar");
let rings = "";
for (const s of [25, 50, 75, 100]) rings += `<polygon class="grid" points="${AXES.map((_, i) => pt(i, s * .95).join(",")).join(" ")}"/>`;
AXES.forEach((a, i) => { const [x, y] = pt(i, 95); const [lx, ly] = pt(i, 112); rings += `<line class="grid" x1="0" y1="0" x2="${x}" y2="${y}"/><text x="${lx}" y="${ly + 3}" text-anchor="middle">${a}</text>`; });
radar.innerHTML = rings + `<polygon class="shape" id="shape"/>`;
let shapeVals = [0, 0, 0, 0, 0], shapeFrom = shapeVals, shapeTo = shapeVals, shapeT = 1;
function animRadar(ts) {
  shapeT = Math.min(1, shapeT + .05);
  const e = 1 - Math.pow(1 - shapeT, 3);
  shapeVals = shapeFrom.map((f, i) => f + (shapeTo[i] - f) * e);
  $("shape").setAttribute("points", shapeVals.map((v, i) => pt(i, v * .95).join(",")).join(" "));
  requestAnimationFrame(animRadar);
}
requestAnimationFrame(animRadar);

/* ---------- priority stack ---------- */
const LAYERS = [["EMERGENCY", "em"], ["TRIGGER 1"], ["TRIGGER 2"], ["TRIGGER 3"], ["OPENING"], ["CORE"]];
const iso = $("iso"), labels = $("labels");
const layerEls = LAYERS.map(([n, cls], i) => {
  const l = document.createElement("div"); l.className = "layer" + (cls ? " " + cls : "");
  l.dataset.z = (LAYERS.length - 1 - i) * 22;
  l.onmouseenter = () => setLayer(i); iso.appendChild(l);
  const b = document.createElement("button"); b.textContent = n; if (cls) b.classList.add(cls);
  b.onmouseenter = () => setLayer(i); labels.appendChild(b);
  return [l, b];
});
function setLayer(i) {
  layer = (i + LAYERS.length) % LAYERS.length;
  layerEls.forEach(([l, b], j) => {
    const z = +l.dataset.z + (j === layer ? 16 : 0);
    l.style.transform = `translateZ(${z}px) ${j === layer ? "translate(-8px,-8px)" : ""}`;
    l.classList.toggle("on", j === layer); b.classList.toggle("on", j === layer);
  });
  const b = BRAINS[curIdx];
  let cond, text;
  if (layer === 0) { cond = `WHEN OWN HP < ${b.emergency[0]}%  · OVERRIDES ALL`; text = b.emergency[1]; }
  else if (layer <= 3) { const [c, d] = b.triggers[layer - 1]; cond = `WHEN ${c}`; text = d; }
  else if (layer === 4) { cond = "OPENING READ · FIRST ROUNDS"; text = b.opening; }
  else { cond = "CORE DIRECTIVE · ALWAYS ON"; text = b.core; }
  typeOut(cond, text);
}
let typeTimer;
function typeOut(cond, text) {
  clearInterval(typeTimer);
  const d = $("detail"); let n = 0;
  typeTimer = setInterval(() => {
    n += 3;
    const shown = text.slice(0, n);
    d.innerHTML = `<div class="cond">${cond}</div><p>${hl(shown)}${n < text.length ? '<span class="caret"></span>' : ""}</p>`;
    if (n >= text.length) clearInterval(typeTimer);
  }, 16);
}

/* ---------- navigation ---------- */
let pos = 0, curIdx = 0;
const idxOf = (p) => ((p % N) + N) % N;
function goTo(j) { let d = j - curIdx; if (d > N / 2) d -= N; if (d < -N / 2) d += N; step(d); }
function step(d) {
  if (linking) return;
  pos += d; curIdx = idxOf(pos);
  cards.forEach((c, j) => {
    let rel = j - curIdx; if (rel > N / 2) rel -= N; if (rel < -N / 2) rel += N;
    const prev = +(c.dataset.rel ?? rel);
    c.style.transition = Math.abs(rel - prev) > 2 ? "none" : "";
    c.dataset.rel = rel;
    const base = `rotateY(${rel * STEP}deg) translateZ(${R}px)`;
    c.style.setProperty("--base", base); c.style.transform = base;
    c.style.opacity = Math.abs(rel) > 1 ? .35 : 1;
    c.classList.toggle("on", j === curIdx);
  });
  dots.forEach((el, j) => el.classList.toggle("on", j === curIdx));
  const b = BRAINS[curIdx];
  document.documentElement.style.setProperty("--accent", b.accent);
  $("backword").textContent = b.name.toUpperCase();
  $("desig").textContent = b.designation;
  $("quote").textContent = `“${b.role}”`;
  shapeFrom = shapeVals; shapeTo = b.matrix; shapeT = 0;
  setLayer(layer);
}

function link() {
  if (linking) return;
  linking = true;
  ring.classList.add("linking");
  $("link-name").textContent = BRAINS[curIdx].name.toUpperCase();
  $("link").classList.add("on");
  let p = 0;
  const t = setInterval(() => {
    p = Math.min(100, p + Math.random() * 9 + 2);
    $("link-bar").style.width = p + "%";
    $("link-pct").textContent = p < 100 ? `SYNC ${Math.floor(p)}%` : "LINK ESTABLISHED";
    if (p >= 100) { clearInterval(t); setTimeout(() => { $("link").classList.remove("on"); ring.classList.remove("linking"); linking = false; }, 1400); }
  }, 60);
}

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "a" || k === "arrowleft") step(-1);
  else if (k === "d" || k === "arrowright") step(1);
  else if (k === "w" || k === "arrowup") setLayer(layer - 1);
  else if (k === "s" || k === "arrowdown") setLayer(layer + 1);
  else if (k === "enter") link();
});
let wheelLock = 0;
addEventListener("wheel", (e) => { const now = Date.now(); if (now - wheelLock < 350) return; wheelLock = now; step(Math.sign(e.deltaY || e.deltaX)); }, { passive: true });
addEventListener("pointermove", (e) => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  $("tilt").style.transform = `rotateX(${-y * 8}deg) rotateY(${x * 10}deg)`;
});

cards.forEach((c, j) => (c.onclick = () => (j === curIdx ? link() : goTo(j))));
dots.forEach((d, j) => (d.onclick = () => goTo(j)));
layer = 5; step(0);
</script>
</body>
