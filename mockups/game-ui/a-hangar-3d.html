<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steelmind Mockup A — Hangar 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --amber: #ffb020;
    --amber-deep: #b87a10;
    --ink: #e8e3d5;
    --dim: #97a1aa;
    --faint: #5d6870;
    --glass: rgba(14, 18, 22, 0.68);
    --edge: rgba(255, 176, 32, 0.28);
    --accent: #e25837;
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Saira", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07090b; color: var(--ink); font-family: var(--body); overflow: hidden; user-select: none; }
  kbd { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border: 1px solid currentColor; border-bottom-width: 3px; border-radius: 3px; opacity: .85; }

  #scene { position: fixed; inset: 0; display: block; cursor: grab; }
  #scene:active { cursor: grabbing; }

  /* screen fx */
  .fx { position: fixed; inset: 0; pointer-events: none; }
  .fx.vignette { background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.75) 100%); }
  .fx.scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  .fx.frame::before, .fx.frame::after { content: ""; position: absolute; width: 46px; height: 46px; border: 2px solid var(--edge); }
  .fx.frame::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .fx.frame::after { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
  .fx.flash { background: #fff3d6; opacity: 0; transition: opacity .5s; }
  .fx.flash.on { opacity: .9; transition: opacity .05s; }

  /* 3D callouts */
  #callouts { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #callouts polyline { fill: none; stroke: var(--amber); stroke-width: 1; opacity: .8; }
  #callouts circle { fill: var(--amber); }
  .tag { position: fixed; left: 0; top: 0; pointer-events: none; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; padding: 6px 10px 6px 12px; background: var(--glass); border-left: 2px solid var(--amber); backdrop-filter: blur(6px); white-space: nowrap; transition: opacity .25s; }
  .tag b { display: block; font-family: var(--display); font-size: 16px; letter-spacing: .05em; font-weight: 700; color: var(--ink); }
  .tag span { color: var(--dim); }
  .tag em { font-style: normal; color: var(--amber); }

  /* HUD */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud .i { pointer-events: auto; }

  .top { position: absolute; top: 28px; left: 36px; right: 36px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .brand { display: flex; gap: 12px; align-items: center; }
  .logo { width: 30px; height: 30px; background: var(--amber); clip-path: polygon(50% 0, 100% 28%, 100% 72%, 50% 100%, 0 72%, 0 28%); position: relative; }
  .logo::after { content: ""; position: absolute; inset: 7px; background: #07090b; clip-path: inherit; }
  .brand b { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .22em; display: block; line-height: 1; }
  .brand small { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .16em; }

  .steps { list-style: none; display: flex; gap: 4px; font-family: var(--display); font-weight: 700; letter-spacing: .14em; font-size: 13px; }
  .steps li { padding: 7px 22px 7px 18px; background: rgba(20,24,28,.7); color: var(--faint); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%); }
  .steps li span { font-family: var(--mono); font-size: 10px; font-weight: 500; margin-left: 8px; color: var(--dim); letter-spacing: .08em; }
  .steps li.done { color: var(--ink); }
  .steps li.done::before { content: "✓ "; color: #62b85a; }
  .steps li.now { background: var(--amber); color: #111; }

  .sys { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .12em; text-align: right; line-height: 1.6; }
  .sys b { color: var(--amber); font-weight: 500; }

  /* left identity block */
  .ident { position: absolute; left: 56px; bottom: 150px; max-width: 460px; }
  .ident .desig { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .3em; display: flex; align-items: center; gap: 10px; }
  .ident .desig::before { content: ""; width: 28px; height: 2px; background: var(--accent); }
  .ident h1 { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 9vw, 128px); line-height: .82; letter-spacing: .01em; text-transform: uppercase; margin: 10px 0 8px; text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 45%, transparent); }
  .ident .role { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .ident .doctrine { margin-top: 14px; font-size: 15px; line-height: 1.5; color: var(--ink); opacity: .85; border-left: 2px solid var(--accent); padding-left: 12px; font-style: italic; }
  .swap { animation: swapIn .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes swapIn { 0% { opacity: 0; transform: translateX(-24px); filter: blur(6px); clip-path: inset(-20% 100% -20% -20%); } 100% { opacity: 1; transform: none; filter: none; clip-path: inset(-20% -60% -20% -20%); } }

  /* right stat panel */
  .stats { position: absolute; right: 36px; top: 50%; transform: translateY(-50%) perspective(900px) rotateY(-9deg); transform-origin: right center; width: 340px; padding: 22px 22px 20px; background: var(--glass); backdrop-filter: blur(10px); clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); border-top: 1px solid var(--edge); }
  .stats h2 { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .3em; color: var(--amber); margin-bottom: 16px; display: flex; justify-content: space-between; }
  .stats h2 span { color: var(--faint); font-family: var(--mono); font-weight: 400; letter-spacing: .1em; font-size: 10px; }
  .row { margin-bottom: 14px; }
  .row .lbl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--dim); margin-bottom: 6px; }
  .row .lbl b { color: var(--ink); font-weight: 600; }
  .bar { height: 8px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--c, var(--amber)) 0 9px, transparent 9px 11px); transition: width .7s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 12px var(--c, var(--amber)); }
  .pips { display: flex; gap: 4px; }
  .pips i { flex: 1; height: 8px; background: rgba(255,255,255,.07); transform: skewX(-20deg); transition: background .3s; }
  .pips i.on { background: var(--amber); box-shadow: 0 0 10px rgba(255,176,32,.5); }
  .weapons { display: grid; gap: 8px; margin-top: 18px; }
  .wpn { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: rgba(255,255,255,.035); border-left: 2px solid var(--accent); }
  .wpn svg { width: 34px; height: 34px; }
  .wpn b { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: .04em; display: block; line-height: 1.1; }
  .wpn small { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .1em; }
  .wpn .dmg { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--amber); text-align: right; line-height: 1; }
  .wpn .dmg small { display: block; font-size: 9px; }

  /* chassis picker */
  .picker { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 8px; }
  .nav { background: none; border: 0; color: var(--dim); font-family: var(--display); font-size: 22px; display: flex; align-items: center; gap: 8px; padding: 0 10px; cursor: pointer; }
  .nav:hover { color: var(--amber); }
  .tile { width: 150px; padding: 12px 16px 10px; background: rgba(14,18,22,.72); border: 0; color: var(--dim); text-align: left; cursor: pointer; transform: skewX(-12deg); position: relative; transition: transform .25s, background .25s, color .25s; }
  .tile > * { display: block; transform: skewX(12deg); }
  .tile small { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; }
  .tile b { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--c); opacity: .35; transition: opacity .25s; }
  .tile:hover { color: var(--ink); }
  .tile.on { background: rgba(255,176,32,.14); color: var(--ink); transform: skewX(-12deg) translateY(-8px); }
  .tile.on::after { opacity: 1; box-shadow: 0 0 18px var(--c); }

  /* deploy */
  .deploy { position: absolute; right: 36px; bottom: 36px; width: 280px; height: 78px; border: 0; background: rgba(255,176,32,.12); color: var(--amber); cursor: pointer; clip-path: polygon(22px 0, 100% 0, 100% 100%, 0 100%, 0 22px); overflow: hidden; font-family: var(--display); text-align: left; padding: 0 26px; }
  .deploy::before { content: ""; position: absolute; inset: 0; border: 1px solid var(--amber); clip-path: inherit; }
  .deploy .fill { position: absolute; inset: 0; background: var(--amber); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .deploy .lbl { position: relative; font-size: 34px; font-weight: 800; letter-spacing: .2em; display: block; line-height: 1; mix-blend-mode: difference; color: var(--amber); }
  .deploy small { position: relative; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); }
  .deploy:hover { background: rgba(255,176,32,.2); }

  .hint { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); font-family: var(--mono); font-size: 10px; letter-spacing: .24em; color: var(--faint); }

  .locked { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
  .locked.on { opacity: 1; }
  .locked div { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 92px); letter-spacing: .3em; color: var(--amber); text-shadow: 0 0 40px rgba(255,176,32,.6); padding: 12px 40px; background: rgba(7,9,11,.6); border-top: 2px solid; border-bottom: 2px solid; }

  .mock { position: fixed; left: 36px; bottom: 36px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--faint); pointer-events: auto; }
  .mock a { color: var(--dim); text-decoration: none; margin-right: 10px; }
  .mock a:hover, .mock a.cur { color: var(--amber); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); color: var(--amber); letter-spacing: .3em; font-size: 12px; background: #07090b; transition: opacity .6s; }

  @media (max-width: 900px) {
    .stats { top: auto; bottom: 170px; transform: none; right: 16px; width: 280px; padding: 14px; }
    .ident { left: 16px; top: 110px; bottom: auto; }
    .steps, .sys, .tag, #callouts, .hint { display: none; }
    .top { left: 16px; right: 16px; }
    .deploy { right: 16px; bottom: 16px; width: 180px; height: 60px; }
    .deploy .lbl { font-size: 24px; }
    .picker { bottom: 90px; }
    .tile { width: 96px; padding: 8px 10px; }
    .tile b { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<svg id="callouts"></svg>
<div class="tag" id="tag-melee"></div>
<div class="tag" id="tag-ranged"></div>
<div class="tag" id="tag-sensor"></div>
<div class="fx vignette"></div>
<div class="fx scan"></div>
<div class="fx frame"></div>

<div class="hud">
  <header class="top">
    <div class="brand">
      <span class="logo"></span>
      <div><b>STEELMIND</b><small>HANGAR 04 · CHASSIS BAY</small></div>
    </div>
    <ol class="steps">
      <li class="done">BRAIN<span>BERSERKER</span></li>
      <li class="now">CHASSIS</li>
      <li>DEPLOY</li>
    </ol>
    <div class="sys">DEV SANDBOX · <b>ONLINE</b><br><span id="clock">00:00:00</span></div>
  </header>

  <section class="ident" id="ident">
    <div class="desig" id="desig"></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p class="doctrine" id="doctrine"></p>
  </section>

  <aside class="stats i">
    <h2>CHASSIS DATA <span id="mass"></span></h2>
    <div class="row"><div class="lbl">HULL POINTS <b id="hp"></b></div><div class="bar"><i id="hp-bar" style="--c:#62b85a"></i></div></div>
    <div class="row"><div class="lbl">ARMOR <b id="armor"></b></div><div class="pips" id="armor-pips"><i></i><i></i><i></i></div></div>
    <div class="row"><div class="lbl">MOBILITY <b id="mob"></b></div><div class="pips" id="mob-pips"><i></i><i></i><i></i></div></div>
    <div class="row"><div class="lbl">ADVANCE / CHARGE <b id="move"></b></div><div class="bar"><i id="move-bar" style="--c:#45c4cf"></i></div></div>
    <div class="weapons">
      <div class="wpn">
        <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 26 L22 12 M18 8 L26 16 L22 20 L14 12 Z"/></svg>
        <div><b id="melee-name"></b><small id="melee-meta"></small></div>
        <div class="dmg"><span id="melee-dmg"></span><small>DMG</small></div>
      </div>
      <div class="wpn">
        <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20 H22 V14 H30 M8 20 V26 H14 V20 M22 17 H4"/></svg>
        <div><b id="ranged-name"></b><small id="ranged-meta"></small></div>
        <div class="dmg"><span id="ranged-dmg"></span><small>DMG</small></div>
      </div>
    </div>
  </aside>

  <div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>

  <nav class="picker i">
    <button class="nav" id="prev"><kbd>A</kbd>◀</button>
    <div id="tiles" style="display:flex;gap:8px"></div>
    <button class="nav" id="next">▶<kbd>D</kbd></button>
  </nav>

  <button class="deploy i" id="deploy"><span class="fill"></span><span class="lbl">DEPLOY</span><small>HOLD <kbd>ENTER</kbd> OR CLICK</small></button>
</div>

<div class="locked" id="locked"><div>CHASSIS LOCKED</div></div>
<div class="fx flash" id="flash"></div>
<div class="mock">MOCKUP · <a class="cur" href="a-hangar-3d.html">A HANGAR</a><a href="b-neural-select.html">B NEURAL</a><a href="c-cockpit-briefing.html">C COCKPIT</a></div>
<div id="loading">INITIALISING HANGAR…</div>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// Data mirrors apps/web/src/features/profile-selection/profiles.ts
const PROFILES = [
  { id: "BRAWLER", designation: "CDP-01", name: "Brawler", role: "Heavy Line-Breaker",
    doctrine: "Walk in. Close the gap. End it with the hammer.", mass: 85, hp: 220,
    armor: "HEAVY", armorPct: 12, mobility: "LOW", adv: 8, charge: 20,
    melee: { name: "Power Hammer", dmg: 28, en: 16 }, ranged: { name: "Autocannon", dmg: 16, en: 10 },
    accent: "#e25837",
    shape: { legW: .62, thigh: 1.0, shin: 1.05, hipW: 1.25, torsoW: 2.2, torsoH: 1.5, torsoD: 1.5, headW: .6, headH: .42, headD: .6, headZ: .35, shoulder: .95, arm: .8, armT: 1.45 } },
  { id: "ASSAULT", designation: "CDP-02", name: "Assault", role: "Balanced Gunline",
    doctrine: "Hold the mid-range. Make every railgun shot count.", mass: 70, hp: 200,
    armor: "MEDIUM", armorPct: 6, mobility: "MEDIUM", adv: 10, charge: 25,
    melee: { name: "Energy Blade", dmg: 24, en: 12 }, ranged: { name: "Railgun", dmg: 20, en: 16 },
    accent: "#ffb020",
    shape: { legW: .5, thigh: 1.15, shin: 1.2, hipW: 1.05, torsoW: 1.75, torsoH: 1.35, torsoD: 1.2, headW: .6, headH: .5, headD: .65, headZ: .2, shoulder: .75, arm: .9, armT: 1.15 } },
  { id: "SKIRMISHER", designation: "CDP-03", name: "Skirmisher", role: "Light Raider",
    doctrine: "Stay fast, stay unknown. Bleed them at range.", mass: 55, hp: 180,
    armor: "LIGHT", armorPct: 0, mobility: "HIGH", adv: 12, charge: 30,
    melee: { name: "Impact Fist", dmg: 20, en: 8 }, ranged: { name: "Pulse Laser", dmg: 13, en: 7 },
    accent: "#45c4cf",
    shape: { legW: .36, thigh: 1.35, shin: 1.45, hipW: .9, torsoW: 1.3, torsoH: 1.05, torsoD: 1.0, headW: .55, headH: .36, headD: .75, headZ: .35, shoulder: .55, arm: .85, armT: .9 } },
];
const PIPS = { LIGHT: 1, MEDIUM: 2, HEAVY: 3, LOW: 1, HIGH: 3 };

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090b);
scene.fog = new THREE.Fog(0x07090b, 16, 44);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.28;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 120);
const lookAt = new THREE.Vector3(0, 2.4, 0);
let camDist = 17, camDistTarget = 17;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.45, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x8fa3b5, 0x0a0c0e, 0.45));
const key = new THREE.SpotLight(0xfff1dc, 420, 34, Math.PI / 7.5, 0.55, 1.4);
key.position.set(3.5, 13, 6);
key.target.position.set(0, 1.8, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.SpotLight(0xe25837, 260, 30, Math.PI / 6, 0.6, 1.4);
rim.position.set(-5, 8, -7);
rim.target.position.set(0, 2.4, 0);
scene.add(rim, rim.target);
const rim2 = new THREE.SpotLight(0x6fa8c8, 140, 30, Math.PI / 6, 0.6, 1.4);
rim2.position.set(6, 5, -6);
rim2.target.position.set(0, 2.4, 0);
scene.add(rim2, rim2.target);
const floorGlow = new THREE.PointLight(0xffb020, 3, 9, 2);
floorGlow.position.set(0, 0.6, 3.8);
scene.add(floorGlow);

/* ---------- textures ---------- */
function stripeTexture(repeat) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 32;
  const x = c.getContext("2d");
  x.fillStyle = "#15181b"; x.fillRect(0, 0, 128, 32);
  x.fillStyle = "#c8901a";
  for (let i = -32; i < 160; i += 32) { x.beginPath(); x.moveTo(i, 32); x.lineTo(i + 16, 32); x.lineTo(i + 32, 0); x.lineTo(i + 16, 0); x.fill(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.repeat.set(repeat, 1); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function textTexture(text, size, w = 1024, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = `800 ${size}px "Saira Condensed", "Arial Narrow", sans-serif`;
  x.fillText(text, w / 2, h / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- hangar ---------- */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ color: 0x0f1316, metalness: .55, roughness: .5 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(90, 90, 0x3b2c10, 0x1a2025);
grid.position.y = .003; grid.material.transparent = true; grid.material.opacity = .55; scene.add(grid);

const amberLine = new THREE.MeshBasicMaterial({ color: 0xffb020, transparent: true, opacity: .55 });
const floorRing = new THREE.Mesh(new THREE.RingGeometry(4.1, 4.2, 96), amberLine);
floorRing.rotation.x = -Math.PI / 2; floorRing.position.y = .006; scene.add(floorRing);
for (const sx of [-1.9, 1.9]) {
  const l = new THREE.Mesh(new THREE.PlaneGeometry(.08, 14), amberLine);
  l.rotation.x = -Math.PI / 2; l.position.set(sx, .006, 11); scene.add(l);
}
for (let i = 0; i < 6; i++) { // walkway chevrons
  const s = new THREE.Shape(); s.moveTo(-.6, 0); s.lineTo(0, -.45); s.lineTo(.6, 0); s.lineTo(.6, .16); s.lineTo(0, -.29); s.lineTo(-.6, .16);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color: 0xffb020, transparent: true, opacity: .25 - i * .03 }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, .006, 5.2 + i * 1.3); scene.add(m);
}

// turntable
const turntable = new THREE.Group(); scene.add(turntable);
const plateTop = new THREE.MeshStandardMaterial({ color: 0x1c2227, metalness: .8, roughness: .35 });
const plat = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.7, .36, 72), [
  new THREE.MeshStandardMaterial({ map: stripeTexture(22), metalness: .4, roughness: .6 }), plateTop, plateTop]);
plat.position.y = .18; plat.receiveShadow = true; plat.castShadow = true; scene.add(plat);
const glow = (c, i = 3) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i });
const ring = new THREE.Mesh(new THREE.TorusGeometry(3.3, .035, 8, 160), glow(0xffb020, 4));
ring.rotation.x = -Math.PI / 2; ring.position.y = .37; scene.add(ring);
const ringInner = new THREE.Mesh(new THREE.TorusGeometry(2.3, .018, 6, 120), glow(0xffb020, 1.5));
ringInner.rotation.x = -Math.PI / 2; ringInner.position.y = .37; turntable.add(ringInner);
for (let i = 0; i < 60; i++) {
  const a = (i / 60) * Math.PI * 2, long = i % 5 === 0;
  const t = new THREE.Mesh(new THREE.BoxGeometry(.03, .01, long ? .36 : .16), glow(0xffb020, long ? 1.2 : .5));
  t.position.set(Math.sin(a) * 2.85, .37, Math.cos(a) * 2.85); t.rotation.y = a; turntable.add(t);
}

// walls, pillars, strip lights
const wallMat = new THREE.MeshStandardMaterial({ color: 0x191e23, metalness: .6, roughness: .6 });
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x12161a, metalness: .7, roughness: .5 });
const stripMat = glow(0x9fb6c8, 1.2);
const beaconMat = glow(0xffb020, 5);
const R = 18, N = 14, span = Math.PI * 1.25;
for (let i = 0; i <= N; i++) {
  const th = -span / 2 + (i / N) * span;
  const p = new THREE.Mesh(new THREE.BoxGeometry(1.4, 18, 1.4), pillarMat);
  p.position.set(Math.sin(th) * R, 9, -Math.cos(th) * R); p.rotation.y = -th; scene.add(p);
  if (i % 3 === 1) { const b = new THREE.Mesh(new THREE.BoxGeometry(.3, .5, .3), beaconMat); b.position.set(Math.sin(th) * (R - .8), 6.5, -Math.cos(th) * (R - .8)); scene.add(b); }
  if (i === N) break;
  const mid = th + span / N / 2, w = 2 * R * Math.sin(span / N / 2) - 1.3;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 18, .4), wallMat);
  wall.position.set(Math.sin(mid) * (R + .4), 9, -Math.cos(mid) * (R + .4)); wall.rotation.y = -mid; wall.receiveShadow = true; scene.add(wall);
  for (const y of [2.5, 8.5, 14]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(w * .8, .07, .05), stripMat);
    s.position.set(Math.sin(mid) * (R + .15), y, -Math.cos(mid) * (R + .15)); s.rotation.y = -mid; scene.add(s);
  }
}
// gantry
for (const z of [-4, 3]) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(34, .8, .8), pillarMat); g.position.set(0, 14, z); scene.add(g);
  const s = new THREE.Mesh(new THREE.BoxGeometry(30, .05, .2), glow(0xfff1dc, 2)); s.position.set(0, 13.58, z); scene.add(s);
}
// light cone from ceiling
const coneMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  uniforms: { c: { value: new THREE.Color(0xffe2a8) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 c; varying vec2 vUv; void main(){ float a = pow(vUv.y, 1.6) * .10 + .012; gl_FragColor = vec4(c, a); }`,
});
const cone = new THREE.Mesh(new THREE.CylinderGeometry(.5, 4.2, 13.4, 48, 1, true), coneMat);
cone.position.set(0, 6.9, 0); scene.add(cone);

// dust
const dustGeo = new THREE.BufferGeometry(), DUST = 500, dp = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) { dp[i * 3] = (Math.random() - .5) * 14; dp[i * 3 + 1] = Math.random() * 12; dp[i * 3 + 2] = (Math.random() - .5) * 14; }
dustGeo.setAttribute("position", new THREE.BufferAttribute(dp, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffe0a0, size: .035, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(dust);

/* ---------- mech builder ---------- */
const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const scanRing = new THREE.Mesh(new THREE.TorusGeometry(1.9, .025, 6, 96), glow(0xffb020, 6));
scanRing.rotation.x = -Math.PI / 2; scanRing.visible = false; scene.add(scanRing);

function buildMech(p) {
  const s = p.shape, accent = new THREE.Color(p.accent);
  const mat = (o) => new THREE.MeshStandardMaterial({ clippingPlanes: [clip], clipShadows: true, ...o });
  const body = mat({ color: 0x56616a, metalness: .6, roughness: .42 });
  const dark = mat({ color: 0x23292e, metalness: .7, roughness: .45 });
  const paint = mat({ color: accent.clone().multiplyScalar(.36), metalness: .45, roughness: .45 });
  const lit = mat({ color: accent, emissive: accent, emissiveIntensity: 3.2 });
  const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const C = (r, h, seg = 12) => new THREE.CylinderGeometry(r, r, h, seg);
  const add = (geo, m, x, y, z, parent, rx = 0, ry = 0, rz = 0) => {
    const mesh = new THREE.Mesh(geo, m); mesh.position.set(x, y, z); mesh.rotation.set(rx, ry, rz);
    mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh;
  };

  const root = new THREE.Group();
  const kneeY = .25 + s.shin, hipY = kneeY + s.thigh;
  for (const side of [-1, 1]) {
    const hx = side * s.hipW / 2;
    add(B(s.legW * 1.5, .25, s.legW * 2.5), dark, hx * 1.08, .125, .15, root);
    add(B(s.legW * 1.3, .12, s.legW * .6), paint, hx * 1.08, .3, .15 + s.legW * 1.1, root);
    add(B(s.legW * 1.05, s.shin, s.legW * 1.2), body, hx * 1.08, .25 + s.shin / 2, 0, root);
    add(B(s.legW * .9, s.shin * .7, .12), paint, hx * 1.08, .25 + s.shin * .55, s.legW * .62, root, -.08);
    add(B(s.legW * 1.25, s.legW * .8, s.legW * 1.35), dark, hx * 1.05, kneeY, .12, root);
    add(B(s.legW * .95, s.thigh, s.legW * 1.05), body, hx, kneeY + s.thigh / 2, -.05, root, .06);
  }
  add(B(s.hipW + s.legW * 1.1, .45, s.torsoD * .7), dark, 0, hipY, 0, root);

  const torso = new THREE.Group(); torso.position.y = hipY + .2; root.add(torso);
  add(B(s.torsoW, s.torsoH, s.torsoD), body, 0, s.torsoH / 2, 0, torso);
  add(B(s.torsoW * .72, s.torsoH * .5, .14), paint, 0, s.torsoH * .64, s.torsoD / 2 + .05, torso, -.16);
  add(B(s.torsoW * .42, .06, .03), lit, 0, s.torsoH * .3, s.torsoD / 2 + .02, torso);
  add(B(s.torsoW * .5, s.torsoH * .25, .1), dark, 0, s.torsoH * .3, s.torsoD / 2 - .02, torso);
  add(B(s.torsoW * .82, s.torsoH * .82, s.torsoD * .55), dark, 0, s.torsoH * .5, -s.torsoD / 2 - s.torsoD * .22, torso);

  const head = new THREE.Group(); head.position.set(0, s.torsoH + s.headH / 2 - .04, s.headZ); torso.add(head);
  add(B(s.headW, s.headH, s.headD), body, 0, 0, 0, head);
  add(B(s.headW * .82, .07, .03), lit, 0, s.headH * .05, s.headD / 2 + .01, head);
  const sensor = new THREE.Object3D(); sensor.position.set(0, s.headH * .2, s.headD / 2); head.add(sensor);

  const arms = {};
  for (const side of [-1, 1]) {
    const sx = side * (s.torsoW / 2 + s.shoulder / 2 - .05);
    const arm = new THREE.Group(); arm.position.set(sx, s.torsoH - .15, 0); torso.add(arm);
    add(B(s.shoulder, s.shoulder * .5, s.shoulder * 1.1), paint, side * .05, .02, 0, arm);
    add(B(s.shoulder * 1.02, .05, s.shoulder * .3), dark, side * .05, .02, s.shoulder * .45, arm);
    add(B(.34 * s.armT, s.arm, .36 * s.armT), body, 0, -s.arm / 2 - .1, 0, arm);
    const fore = new THREE.Group(); fore.position.set(0, -s.arm - .1, 0); fore.rotation.x = -.55; arm.add(fore);
    add(B(.48 * s.armT, s.arm * 1.05, .52 * s.armT), body, 0, -s.arm * .5, 0, fore);
    add(B(.5 * s.armT, .1, .54 * s.armT), dark, 0, -s.arm * .08, 0, fore);
    arms[side] = { arm, fore };
  }

  const meleeA = new THREE.Object3D(), rangedA = new THREE.Object3D();
  const R_ = arms[1].fore, L_ = arms[-1].fore, fl = -s.arm * 1.05;
  if (p.id === "BRAWLER") {
    add(C(.07, 1.2), dark, 0, fl - .35, 0, R_);
    add(B(.62, .5, .95), body, 0, fl - .95, 0, R_);
    add(B(.64, .52, .1), lit, 0, fl - .95, .48, R_);
    meleeA.position.set(0, fl - .95, .5); R_.add(meleeA);
    add(B(.5, .45, .8), dark, 0, fl * .55, .2, L_);
    for (const dx of [-.1, .1]) add(C(.06, 1.1), body, dx, fl * .55, .9, L_, Math.PI / 2);
    rangedA.position.set(0, fl * .55, 1.45); L_.add(rangedA);
    for (const dx of [-.35, .35]) {
      add(C(.12, .9), dark, dx, s.torsoH + .35, -s.torsoD / 2 - .35, torso);
      add(C(.13, .06), lit, dx, s.torsoH + .8, -s.torsoD / 2 - .35, torso);
    }
  } else if (p.id === "ASSAULT") {
    add(B(.2, .25, .2), dark, 0, fl - .05, 0, R_);
    add(B(.05, 1.7, .22), lit, 0, fl - .95, .05, R_);
    meleeA.position.set(0, fl - 1.2, .1); R_.add(meleeA);
    const rail = new THREE.Group(); rail.position.set(-(s.torsoW / 2 + .15), s.torsoH + .35, 0); torso.add(rail);
    add(B(.34, .3, 1.1), dark, 0, 0, -.1, rail);
    for (const dy of [-.08, .08]) add(B(.1, .05, 2.4), body, 0, dy, .9, rail);
    add(B(.03, .08, 2.2), lit, 0, 0, .9, rail);
    rangedA.position.set(0, 0, 2.1); rail.add(rangedA);
    add(C(.02, .9, 6), dark, s.headW * .3, s.headH / 2 + .45, -.1, head);
  } else {
    add(B(.5, .45, .5), dark, 0, fl - .2, 0, R_);
    add(B(.52, .08, .52), lit, 0, fl - .05, 0, R_);
    meleeA.position.set(0, fl - .3, .25); R_.add(meleeA);
    add(C(.13, 1.3), body, 0, fl * .5, .55, L_, Math.PI / 2);
    add(C(.16, .12), lit, 0, fl * .5, 1.2, L_, Math.PI / 2);
    rangedA.position.set(0, fl * .5, 1.25); L_.add(rangedA);
    for (const side of [-1, 1]) add(B(.06, .8, .5), paint, side * s.torsoW * .3, s.torsoH + .2, -s.torsoD / 2 - .3, torso, -.5);
  }

  root.userData = { torso, head, arms, anchors: { melee: meleeA, ranged: rangedA, sensor }, height: hipY + .2 + s.torsoH + s.headH + .9, lit };
  return root;
}

/* ---------- HUD bindings ---------- */
const $ = (id) => document.getElementById(id);
const tiles = PROFILES.map((p, i) => {
  const b = document.createElement("button");
  b.className = "tile"; b.style.setProperty("--c", p.accent);
  b.innerHTML = `<small>${p.designation}</small><b>${p.name}</b>`;
  b.onclick = () => select(i);
  $("tiles").appendChild(b);
  return b;
});
function setPips(el, n) { [...el.children].forEach((pip, i) => pip.classList.toggle("on", i < n)); }
function bindHud(p) {
  document.documentElement.style.setProperty("--accent", p.accent);
  $("desig").textContent = `${p.designation} // COMBAT PROFILE`;
  $("name").textContent = p.name;
  $("role").textContent = p.role;
  $("doctrine").textContent = `“${p.doctrine}”`;
  const ident = $("ident"); ident.classList.remove("swap"); void ident.offsetWidth; ident.classList.add("swap");
  $("mass").textContent = `${p.mass} T`;
  $("hp").textContent = p.hp; $("hp-bar").style.width = `${(p.hp / 240) * 100}%`;
  $("armor").textContent = p.armorPct ? `${p.armor} · −${p.armorPct}% DMG` : p.armor; setPips($("armor-pips"), PIPS[p.armor]);
  $("mob").textContent = p.mobility; setPips($("mob-pips"), PIPS[p.mobility]);
  $("move").textContent = `${p.adv} m / ${p.charge} m`; $("move-bar").style.width = `${(p.charge / 30) * 100}%`;
  $("melee-name").textContent = p.melee.name; $("melee-meta").textContent = `MELEE · CLOSE · ${p.melee.en} EN`; $("melee-dmg").textContent = p.melee.dmg;
  $("ranged-name").textContent = p.ranged.name; $("ranged-meta").textContent = `RANGED · >10 m · ${p.ranged.en} EN`; $("ranged-dmg").textContent = p.ranged.dmg;
  $("tag-melee").innerHTML = `<span>MELEE</span><b>${p.melee.name}</b><em>${p.melee.dmg} DMG</em> <span>· ${p.melee.en} EN</span>`;
  $("tag-ranged").innerHTML = `<span>RANGED</span><b>${p.ranged.name}</b><em>${p.ranged.dmg} DMG</em> <span>· ${p.ranged.en} EN</span>`;
  $("tag-sensor").innerHTML = `<span>SENSOR HEAD</span><b>${p.designation}</b><em>${p.mass} T</em> <span>· ${p.hp} HP</span>`;
  tiles.forEach((t, i) => t.classList.toggle("on", PROFILES[i] === p));
  rim.color.set(p.accent);
}

/* ---------- selection + materialise transition ---------- */
let index = 0, mech = null, clipH = 0, clipTarget = 0, pending = null;
function select(i) {
  index = (i + PROFILES.length) % PROFILES.length;
  bindHud(PROFILES[index]);
  pending = PROFILES[index];
  clipTarget = 0;
  camDistTarget = 16;
  setTimeout(() => (camDistTarget = 17), 450);
}
function swapMech() {
  if (mech) { turntable.remove(mech); mech.traverse((o) => { o.geometry?.dispose(); }); }
  mech = buildMech(pending); pending = null;
  turntable.add(mech);
  clipH = 0; clipTarget = mech.userData.height;
}

$("prev").onclick = () => select(index - 1);
$("next").onclick = () => select(index + 1);

/* ---------- hold-to-deploy ---------- */
let holding = false, hold = 0, deployed = false;
const deployBtn = $("deploy");
const startHold = () => { if (!deployed) holding = true; };
const endHold = () => { holding = false; };
deployBtn.addEventListener("pointerdown", startHold);
addEventListener("pointerup", endHold);
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "a" || k === "arrowleft") select(index - 1);
  if (k === "d" || k === "arrowright") select(index + 1);
  if (k === "enter") startHold();
});
addEventListener("keyup", (e) => { if (e.key === "Enter") endHold(); });
function deploy() {
  deployed = true;
  $("flash").classList.add("on"); setTimeout(() => $("flash").classList.remove("on"), 90);
  $("locked").classList.add("on");
  camDistTarget = 11;
  setTimeout(() => { $("locked").classList.remove("on"); camDistTarget = 17; deployed = false; hold = 0; }, 2600);
}

/* ---------- orbit (drag) + zoom ---------- */
let yaw = -.35, yawVel = 0, dragging = false, lastX = 0, idle = 0, mx = 0, my = 0;
canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; idle = 0; });
addEventListener("pointerup", () => (dragging = false));
addEventListener("pointermove", (e) => {
  mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
  if (!dragging) return;
  yawVel = (e.clientX - lastX) * .006; lastX = e.clientX; idle = 0;
});
canvas.addEventListener("wheel", (e) => { camDistTarget = THREE.MathUtils.clamp(camDistTarget + e.deltaY * .01, 10, 22); }, { passive: true });

/* ---------- callouts ---------- */
const svg = $("callouts");
const calls = ["melee", "ranged", "sensor"].map((k) => {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle"); dot.setAttribute("r", 3);
  svg.append(line, dot);
  return { k, line, dot, tag: $(`tag-${k}`) };
});
const v = new THREE.Vector3(), world = new THREE.Vector3();
function updateCallouts() {
  if (!mech) return;
  const W = innerWidth, H = innerHeight;
  const cx = W / 2, minX = 480, maxX = W - 410;
  const rows = { sensor: -110, ranged: -10, melee: 90 };
  for (const c of calls) {
    const a = mech.userData.anchors[c.k];
    a.getWorldPosition(world);
    v.copy(world).project(camera);
    const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
    const visible = !pending && clipH > world.y + .2 && W > 1100;
    const side = x < cx ? -1 : 1;
    const w = c.tag.offsetWidth;
    const tx = side < 0 ? Math.max(minX + w, x - 150) : Math.min(maxX - w, x + 150);
    const ty = y + rows[c.k] * .4;
    c.line.setAttribute("points", `${x},${y} ${tx - side * 30},${ty} ${tx},${ty}`);
    c.dot.setAttribute("cx", x); c.dot.setAttribute("cy", y);
    c.tag.style.transform = `translate(${side < 0 ? tx - w : tx}px, ${ty - 22}px)`;
    const o = visible ? 1 : 0;
    c.tag.style.opacity = o; c.line.style.opacity = o * .8; c.dot.style.opacity = o;
  }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  // clip transition: dematerialise → swap → materialise
  if (pending && clipH <= .05) swapMech();
  const speed = pending ? 14 : 4.2;
  clipH += Math.sign(clipTarget - clipH) * Math.min(Math.abs(clipTarget - clipH), speed * dt);
  clip.constant = clipH;
  const scanning = mech && Math.abs(clipTarget - clipH) > .02;
  scanRing.visible = scanning; scanRing.position.y = clipH;
  scanRing.scale.setScalar(1 + Math.sin(t * 20) * .02);

  // turntable
  if (!dragging) { yawVel *= .94; idle += dt; if (idle > 2.5) yaw += (Math.sin(t * .22) * .7 - yaw) * dt * .6; }
  yaw += yawVel;
  turntable.rotation.y = yaw;

  // idle life
  if (mech) {
    const u = mech.userData;
    u.torsoBase ??= u.torso.position.y;
    u.torso.position.y = u.torsoBase + Math.sin(t * 1.7) * .025;
    u.head.rotation.y = Math.sin(t * .6) * .3;
    u.arms[1].arm.rotation.x = Math.sin(t * 1.7) * .03;
    u.arms[-1].arm.rotation.x = -Math.sin(t * 1.7) * .03;
    u.lit.emissiveIntensity = 3 + Math.sin(t * 3) * .5;
  }

  // deploy hold
  hold = holding ? Math.min(1, hold + dt * 1.3) : Math.max(0, hold - dt * 3);
  deployBtn.style.setProperty("--p", hold);
  if (hold >= 1 && !deployed) { holding = false; deploy(); }

  // camera
  camDist += (camDistTarget - camDist) * Math.min(1, dt * 3);
  camera.position.set(Math.sin(mx * .25) * camDist + mx * 1.2, 3.3 - my * 1.2, Math.cos(mx * .25) * camDist);
  camera.lookAt(lookAt);

  // dust drift
  const pos = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) { let y = pos.getY(i) + dt * .12; if (y > 12) y = 0; pos.setY(i, y); }
  pos.needsUpdate = true;

  ring.material.emissiveIntensity = 2.2 + Math.sin(t * 2) * .5;
  composer.render();
  updateCallouts();
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
setInterval(() => ($("clock").textContent = new Date().toLocaleTimeString("en-GB")), 1000);

await document.fonts.ready;
const bay = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), new THREE.MeshBasicMaterial({ map: textTexture("BAY 04", 380), transparent: true, opacity: .05, color: 0xffb020, depthWrite: false }));
bay.position.set(0, 9, -R + .2); scene.add(bay);

select(0);
$("loading").style.opacity = 0; setTimeout(() => $("loading").remove(), 700);
tick();
</script>
</body>
</html>
